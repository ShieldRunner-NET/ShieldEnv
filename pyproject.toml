[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shieldenv"
version = "1.0.0"
description = "Local-first secret and AI API key leak prevention CLI"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
shieldenv = "shieldenv.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = [
    "build",
    "full-stack-fastapi-template",
    "juice-shop",
    "venv",
    ".venv",
]